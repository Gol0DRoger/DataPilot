[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gol0DRoger", email = "rishabhrawat106rex@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.18.1",
    "langchain>=1.4.8",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.19",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.2",
    "streamlit>=1.67.0",
]

[project.scripts]
data-agent = "data_agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
